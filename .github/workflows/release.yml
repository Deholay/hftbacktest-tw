name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag and package version
        run: python -c "import pathlib,tomllib; version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert '${{ github.ref_name }}' == f'v{version}', ('${{ github.ref_name }}', version)"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/hftbacktest-slim-release-smoke
      - run: /tmp/hftbacktest-slim-release-smoke/bin/pip install --no-deps dist/*.whl
      - run: /tmp/hftbacktest-slim-release-smoke/bin/python -c "from hftbacktest_slim.engine.binding import NativeBinding; assert NativeBinding().path.is_file()"
      - uses: actions/upload-artifact@v7
        with:
          name: hftbacktest-slim-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
